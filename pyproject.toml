[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-temporal"
version = "0.1.0"
description = "QuaRK: a resource-aware quantum reservoir kernel for temporal learning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
qiskit = ["qiskit>=2.1", "qiskit-aer>=0.17"]
ibm = ["qiskit>=2.1", "qiskit-ibm-runtime>=0.41"]
dev = ["pytest>=8", "hydra-core>=1.3", "omegaconf>=2.3", "flake8>=7"]
all = [
  "cupy-cuda12x>=13",
  "qiskit>=2.1",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.41",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
